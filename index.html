<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أرشيف أعداد مجلة فرحة مصر بعد النصر</title>
<meta name="description" content="أرشيف أعداد مجلة فرحة مصر بعد النصر – المجلس الأعلى للثقافة. تصفّح كل عدد بمحتوياته وابحث في نصوصه.">
<meta property="og:title" content="أرشيف مجلة فرحة مصر بعد النصر"><meta property="og:image" content="covers/2026-10.jpg">
<meta name="theme-color" content="#b3122a">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6ec;--bg2:#f3ead6;--card:#fff;--ink:#1d1a16;--muted:#6b6256;--red:#c8102e;--gold:#d4a017;--black:#17120d;--line:rgba(0,0,0,.09);--shadow:0 18px 40px rgba(60,35,10,.16)}
:root[data-theme="dark"]{--bg:#12100d;--bg2:#1b1712;--card:#221d17;--ink:#f6efe2;--muted:#b5aa97;--line:rgba(255,255,255,.1);--shadow:0 18px 40px rgba(0,0,0,.55)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom,0)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 85% -5%,rgba(200,16,46,.16),transparent 60%),radial-gradient(800px 500px at 0 25%,rgba(212,160,23,.18),transparent 60%),var(--bg)}
a{color:inherit;text-decoration:none}.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.flag{height:8px;background:linear-gradient(90deg,var(--red) 33%,#fff 33% 66%,var(--black) 66%)}
.top{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:62px}
.brand{font-family:'Amiri',serif;font-size:24px;font-weight:700;color:var(--red);display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold),#9a7208);color:#fff;font-size:18px;box-shadow:0 3px 0 #9a7208}
.btn{--c1:#ee3b57;--c2:#c8102e;--cd:#7d0a1d;display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;border:0;font-family:inherit;font-weight:800;font-size:17px;color:#fff;padding:14px 26px;border-radius:16px;position:relative;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 6px 0 var(--cd),0 14px 22px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.12);text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .12s,box-shadow .12s,filter .2s}
.btn:hover{transform:translateY(-3px);filter:brightness(1.08);box-shadow:0 9px 0 var(--cd),0 20px 28px rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.4)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--cd),0 4px 8px rgba(0,0,0,.25)}
.btn::after{content:"";position:absolute;inset:3px 8px auto;height:42%;border-radius:12px 12px 40px 40px;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent);pointer-events:none}
.btn.sm{font-size:14px;padding:9px 16px;border-radius:12px;box-shadow:0 4px 0 var(--cd),0 8px 14px rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.35)}
.btn.sm:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cd)}
.icon-btn{width:46px;height:46px;padding:0;border-radius:14px;font-size:20px}
.gold{--c1:#f6c344;--c2:#d4a017;--cd:#8a6606;color:#2b1d00;text-shadow:0 1px 0 rgba(255,255,255,.4)}.dark{--c1:#4a4038;--c2:#1f1a15;--cd:#000}
.green{--c1:#3ed07a;--c2:#12a150;--cd:#0a6a33}.blue{--c1:#4aa8ff;--c2:#1769d6;--cd:#0d4290}.purple{--c1:#a77bff;--c2:#6d3fe0;--cd:#43229b}
.head{padding:50px 0 14px;text-align:center}
h1{font-family:'Amiri',serif;font-size:clamp(36px,6vw,64px);line-height:1.2;background:linear-gradient(120deg,var(--red) 20%,var(--gold) 60%,var(--ink));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-weight:600;font-size:19px;margin-top:6px}
.bar{width:84px;height:7px;border-radius:9px;margin:16px auto 0;background:linear-gradient(90deg,var(--red),var(--gold))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px;padding:34px 0 50px}
.issue{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;opacity:0;transform:translateY(24px);transition:.7s}
.issue.in{opacity:1;transform:none}
.cov{perspective:900px}.cov img{width:200px;aspect-ratio:623/870;object-fit:cover;border-radius:5px 12px 12px 5px;box-shadow:0 22px 40px rgba(0,0,0,.35);transform:rotateY(-16deg);transition:transform .3s}
.issue:hover .cov img{transform:rotateY(-4deg) translateY(-4px)}
.tag{display:inline-block;background:var(--bg2);color:var(--red);font-weight:800;font-size:13px;border-radius:99px;padding:3px 14px}
.issue h2{font-size:20px;font-weight:800;line-height:1.5}.issue p{color:var(--muted);font-weight:600;font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:4px}
.stats{display:flex;gap:10px}.stats span{background:var(--bg2);border-radius:12px;padding:4px 12px;font-weight:700;font-size:13px}
footer{background:var(--black);color:#e9dfcc;text-align:center;padding:30px 20px calc(30px + env(safe-area-inset-bottom,0));font-size:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.issue{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="flag"></div>
<header class="top"><div class="wrap">
  <a class="brand" href="./"><i>★</i> فرحة مصر</a>
  <button class="btn sm dark icon-btn" id="theme" aria-label="تبديل الوضع">🌙</button>
</div></header>
<main class="wrap">
  <div class="head"><h1>أرشيف أعداد المجلة</h1><p class="sub">مجلة «فرحة مصر بعد النصر» · المجلس الأعلى للثقافة</p><div class="bar"></div></div>
  <div class="grid" id="grid"></div>
</main>
<footer>المجلس الأعلى للثقافة · أمانة المؤتمرات الدولية</footer>
<script>
/* ===== لإضافة عدد جديد: انسخ كائنًا واحدًا في هذه القائمة (الأحدث أولًا) =====
   page: ملف صفحة العدد · cover: صورة الغلاف · flip: رابط Flip Book */
const ISSUES=[
 {tag:"العدد التذكاري الثاني · أكتوبر 2026",title:"فرحة مصر بعد النصر",note:"احتفاءً بالذكرى الثالثة والخمسين لانتصارات أكتوبر المجيدة",
  page:"issue-2026-10.html",cover:"covers/2026-10.jpg",flip:"https://online.flipbuilder.com/rigxq/psgt/",pages:161,articles:43}
];
const g=document.getElementById("grid");
ISSUES.forEach(i=>g.insertAdjacentHTML("beforeend",`<article class="issue">
  <div class="cov"><img src="${i.cover}" alt="غلاف ${i.tag}" loading="lazy"></div>
  <span class="tag">${i.tag}</span><h2>${i.title}</h2><p>${i.note}</p>
  <div class="stats"><span>${i.pages} صفحة</span><span>${i.articles} مقالًا</span></div>
  <div class="acts"><a class="btn green" href="${i.page}">📚 تصفّح العدد وابحث فيه</a><a class="btn gold" href="${i.flip}">📖 Flip Book</a></div></article>`));
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1});
document.querySelectorAll(".issue").forEach(el=>io.observe(el));
const root=document.documentElement,tb=document.getElementById("theme");
const setTheme=t=>{root.dataset.theme=t;tb.textContent=t==="dark"?"☀️":"🌙";try{localStorage.setItem("theme",t)}catch{}};
let sv;try{sv=localStorage.getItem("theme")}catch{}
setTheme(sv||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
tb.onclick=()=>setTheme(root.dataset.theme==="dark"?"light":"dark");
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
